{% extends "base.html" %}
{% block title %}新评测 · Hy3-ContestLens{% endblock %}
{% block content %}
<section class="page-head"><span class="eyebrow">NEW RUN</span><h1>创建一次可审计评测</h1><p>运行开始后会冻结题面、测试集与代码哈希；初次结果不会被后续修复覆盖。</p></section>
<section class="panel narrow"><label>题目<select id="run-problem">{% for problem in problems %}<option value="{{ problem.problem_id }}">{{ problem.title_zh }} · {{ problem.problem_id }}</option>{% endfor %}</select></label><label>最大修复轮数<input id="repair-rounds" type="number" min="1" max="5" value="3"></label><label class="check"><input id="repair-enabled" type="checkbox" checked> 启用有界循环修复</label><button class="primary wide" onclick="createRun()">创建并启动</button><pre id="run-create-result">运行需要先完成该题资源 binding，并配置 Hy3。</pre></section>
{% endblock %}
{% block scripts %}<script>const selected=new URLSearchParams(location.search).get('problem');if(selected)document.getElementById('run-problem').value=selected;</script>{% endblock %}
