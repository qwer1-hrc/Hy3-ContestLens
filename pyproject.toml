[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hy3-contestlens"
version = "0.1.0"
description = "A Hy3-based process evaluator and error localizer for NOIP 2018 solutions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Hy3-ContestLens contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "mcp>=1.2,<2",
  "pydantic>=2.9,<3",
  "pypdf>=5,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
vision = ["pypdfium2>=4.30,<6", "Pillow>=10.4,<13"]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
]

[project.scripts]
hy3-contest = "hy3_contestlens.cli.main:main"
hy3-contest-api = "hy3_contestlens.api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hy3_contestlens"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]
